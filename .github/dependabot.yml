# Group Angular packages so peers stay aligned (avoids npm ERESOLVE).
version: 2
updates:
  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - gRoussac
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "@schematics/angular"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - gRoussac
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
